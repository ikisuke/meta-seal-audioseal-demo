[project]
name = "meta-seal-audioseal-demo"
version = "0.1.0"
description = "A small reproducible Meta Seal / AudioSeal trial."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "audioseal==0.2.0",
    "fastapi>=0.121.0",
    "python-multipart>=0.0.20",
    "scipy>=1.15.3",
    "soundfile>=0.13.1",
    "uvicorn[standard]>=0.38.0",
]

[project.optional-dependencies]
video = [
    "opencv-python>=4.13.0.92",
    "requests>=2.34.2",
    "videoseal==1.0.1",
]

[project.scripts]
audioseal-demo = "meta_seal_audioseal_demo:main"
audioseal-web = "meta_seal_audioseal_demo.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meta_seal_audioseal_demo"]
